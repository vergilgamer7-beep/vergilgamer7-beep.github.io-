<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gran Mega Rifa Navideña — Admin</title>
<style>
  :root{
    --bg:#2b0d14; --bg2:#4a0f1c; --surface:#3a1420; --text:#fbeee7; --muted:#e8b9a8;
    --border:#6b2333; --accent:#c0392b; --accent2:#1e8a5f;
    --taken:#7a2331; --taken-bg:#4a1622; --free:#3a1a23; --free-border:#8a3348;
    --gold:#e8b84b; --gold2:#fff2c9;
    box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  }
  html{scroll-padding-top:env(safe-area-inset-top,0px)}
  *{box-sizing:border-box}
  body{margin:0;background:radial-gradient(circle at 50% 0%,var(--bg2),var(--bg) 70%);
    color:var(--text);font-family:'Segoe UI',system-ui,sans-serif;min-height:100%}
  #app{max-width:900px;margin:0 auto;padding:18px 14px 60px}
  h1{font-size:1.5rem;margin:.2em 0 .05em;text-align:center;font-weight:800;
    background:linear-gradient(90deg,#fff,var(--gold2) 55%,var(--gold));-webkit-background-clip:text;
    background-clip:text;color:transparent}
  .sub{color:var(--muted);text-align:center;font-size:.85rem;margin-bottom:14px}
  .banner{background:linear-gradient(135deg,var(--accent),var(--gold));color:#fff;border-radius:14px;
    padding:12px 16px;text-align:center;font-size:.9rem;margin-bottom:16px;
    box-shadow:0 4px 18px rgba(232,184,75,.25);animation:fadeDown .5s ease}
  .banner b{font-size:1.05rem;text-transform:uppercase}
  @keyframes fadeDown{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:translateY(0)}}
  .toolbar{display:flex;gap:8px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
  input[type=text],input[type=search]{flex:1;min-width:160px;padding:10px 12px;border-radius:10px;
    border:1px solid var(--border);background:var(--surface);color:var(--text);font-size:1rem}
  .badge{padding:6px 12px;border-radius:999px;font-size:.78rem;font-weight:600;background:var(--accent2);color:#fff}
  .legend{display:flex;gap:14px;justify-content:center;margin-bottom:12px;font-size:.78rem;color:var(--muted)}
  .dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:middle}
  .dot.free{background:var(--free-border)} .dot.taken{background:var(--taken)}
  #stats{text-align:center;font-size:.82rem;color:var(--muted);margin-bottom:10px}
  #grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(52px,1fr));gap:6px}
  .num{border:1px solid var(--free-border);background:var(--free);border-radius:8px;padding:8px 0;
    text-align:center;font-weight:600;font-size:.82rem;cursor:pointer;transition:transform .12s ease,box-shadow .12s ease;user-select:none}
  .num:hover{transform:scale(1.08);box-shadow:0 3px 8px rgba(0,0,0,.12)}
  .num.taken{background:var(--taken-bg);border-color:var(--taken);color:var(--taken)}
  .num.dim{opacity:.15;pointer-events:none}
  .num.pop{animation:pop .35s ease}
  @keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.35)}100%{transform:scale(1)}}
  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center;
    z-index:50;padding:16px;animation:fadeDown .18s ease}
  .card{background:var(--surface);border-radius:16px;padding:20px;max-width:340px;width:100%;box-shadow:0 12px 30px rgba(0,0,0,.25)}
  .card h2{margin:0 0 4px;font-size:1.1rem} .card p{color:var(--muted);font-size:.85rem;margin:0 0 12px}
  .card input{width:100%;padding:10px;border-radius:8px;border:1px solid var(--border);margin-bottom:10px;background:var(--bg);color:var(--text)}
  .row{display:flex;gap:8px}
  button.btn{flex:1;padding:10px;border:none;border-radius:8px;font-weight:600;cursor:pointer;font-size:.9rem}
  .btn.primary{background:var(--accent2);color:#fff} .btn.danger{background:var(--taken);color:#fff} .btn.ghost{background:var(--border);color:var(--text)}
  .btn.big{width:100%;padding:16px;font-size:1rem}
  #toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);background:var(--text);color:var(--bg);
    padding:10px 18px;border-radius:999px;font-size:.85rem;opacity:0;transition:all .25s ease;pointer-events:none;max-width:90vw;text-align:center}
  #toast.show{opacity:1;transform:translate(-50%,0)}
  .confetti{position:fixed;top:-10px;width:8px;height:8px;border-radius:2px;pointer-events:none;z-index:60;animation:fall linear forwards}
  @keyframes fall{to{transform:translateY(105vh) rotate(360deg);opacity:.2}}
  #screenStart{max-width:380px;margin:60px auto 0;text-align:center;animation:fadeDown .4s ease}
  .startCard{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:24px 20px;margin-top:18px}
  #pinArea input{width:100%;padding:10px;border-radius:8px;border:1px solid var(--border);background:var(--bg);color:var(--text);margin-bottom:10px}
  .progressWrap{margin-bottom:12px}
  .progressLabel{display:flex;justify-content:space-between;font-size:.72rem;color:var(--muted);margin-bottom:4px}
  .progressTrack{height:10px;border-radius:999px;background:var(--surface);border:1px solid var(--border);overflow:hidden;position:relative}
  .progressFill{height:100%;background:linear-gradient(90deg,var(--accent),var(--gold));border-radius:999px;transition:width .5s ease;width:0%}
  .progressTrack::after{content:'';position:absolute;left:80%;top:-2px;bottom:-2px;width:2px;background:var(--gold2);opacity:.8}
</style>
</head>
<body>
<div id="app">
  <div id="screenStart">
    <h1>🛠️ Admin — Gran Mega Rifa Navideña</h1>
    <div class="sub">Panel de registro de números</div>
    <div class="startCard">
      <div id="pinArea">
        <input type="text" id="pinInput" placeholder="Clave admin">
        <button class="btn primary big" id="pinBtn">Entrar</button>
      </div>
    </div>
  </div>

  <div id="mainScreen" style="display:none">
    <div class="row" style="margin-bottom:10px;justify-content:space-between;align-items:center">
      <span class="badge">🛠️ Modo Admin</span>
    </div>
    <div class="banner" id="banner"></div>
    <div class="progressWrap">
      <div class="progressLabel"><span id="progressText">0 vendidos</span><span>Meta sorteo: 80%</span></div>
      <div class="progressTrack"><div class="progressFill" id="progressFill"></div></div>
    </div>
    <div class="toolbar"><input type="search" id="search" placeholder="Buscar número (ej: 042)"></div>
    <div class="legend"><span><span class="dot free"></span>Disponible</span><span><span class="dot taken"></span>Ocupado</span></div>
    <div id="stats"></div>
    <div id="grid"></div>
  </div>
</div>
<div id="toast"></div>

<script>
(function(){
  // ====== CONFIGURA ESTO ======
  // Debe ser EXACTAMENTE el mismo BLOB_ID que en invitado.html
  var BLOB_ID = 'PEGA-AQUI-TU-BLOB-ID';
  var ADMIN_PIN = '32397238';
  // =============================
  var API = 'https://jsonblob.com/api/jsonBlob/' + BLOB_ID;
  var TOTAL = 1000;
  var registros = {};

  var grid = document.getElementById('grid');
  var searchEl = document.getElementById('search');
  var statsEl = document.getElementById('stats');
  var bannerEl = document.getElementById('banner');
  var screenStart = document.getElementById('screenStart');
  var mainScreen = document.getElementById('mainScreen');

  function pad(n){ return String(n).padStart(3,'0'); }
  function daysLeft(){ return Math.ceil((new Date('2026-12-24T23:59:59')-new Date())/86400000); }
  function renderBanner(){
    var d = daysLeft();
    bannerEl.innerHTML = '<b>Rifa activa</b><br>Vigente hasta el 24 de diciembre de 2026' + (d>0 ? (' · faltan ' + d + ' días') : ' · ¡última recta!');
  }

  document.getElementById('pinBtn').onclick = function(){
    var v = document.getElementById('pinInput').value.trim();
    if(v === ADMIN_PIN){
      screenStart.style.display = 'none';
      mainScreen.style.display = '';
      loadData();
    } else { toast('Clave incorrecta'); }
  };

  function stats(){
    var taken = Object.keys(registros).length;
    statsEl.textContent = taken + ' de ' + TOTAL + ' números ocupados · ' + (TOTAL-taken) + ' disponibles';
    var pct = Math.min(100, Math.round((taken/TOTAL)*100));
    document.getElementById('progressFill').style.width = pct + '%';
    document.getElementById('progressText').textContent = taken + ' vendidos (' + pct + '%)';
  }

  function renderGrid(filter){
    grid.innerHTML = '';
    var frag = document.createDocumentFragment();
    for(var i=0;i<TOTAL;i++){
      var num = pad(i);
      var taken = !!registros[num];
      var el = document.createElement('div');
      el.className = 'num' + (taken?' taken':'');
      el.dataset.num = num;
      el.textContent = num;
      if(filter && num.indexOf(filter) === -1){ el.classList.add('dim'); }
      frag.appendChild(el);
    }
    grid.appendChild(frag);
    stats();
  }

  grid.addEventListener('click', function(e){
    var el = e.target.closest('.num');
    if(!el || el.classList.contains('dim')) return;
    var num = el.dataset.num;
    if(registros[num]){ openRelease(num); } else { openRegister(num); }
  });

  searchEl.addEventListener('input', function(){ renderGrid(searchEl.value.replace(/[^0-9]/g,'') || null); });

  function openRegister(num){
    var ov = document.createElement('div');
    ov.className = 'overlay';
    ov.innerHTML = '<div class="card"><h2>Registrar número ' + num + '</h2>' +
      '<p>Ingresa los datos del participante</p>' +
      '<input type="text" id="fNombre" placeholder="Nombre">' +
      '<input type="text" id="fApellido" placeholder="Apellido">' +
      '<input type="text" id="fCedula" placeholder="Cédula" inputmode="numeric">' +
      '<input type="text" id="fTelefono" placeholder="Teléfono" inputmode="tel">' +
      '<div class="row"><button class="btn ghost" id="cancel">Cancelar</button><button class="btn primary" id="confirm">Guardar</button></div></div>';
    document.body.appendChild(ov);
    ov.querySelector('#cancel').onclick = function(){ ov.remove(); };
    ov.querySelector('#confirm').onclick = function(){
      var nombre = document.getElementById('fNombre').value.trim();
      var apellido = document.getElementById('fApellido').value.trim();
      var cedula = document.getElementById('fCedula').value.trim();
      var telefono = document.getElementById('fTelefono').value.trim();
      if(!nombre || !apellido){ toast('Completa nombre y apellido'); return; }
      registros[num] = { nombre: nombre, apellido: apellido, cedula: cedula, telefono: telefono };
      save(); ov.remove(); renderGrid(); pop(num); confetti();
      toast('Número ' + num + ' registrado a ' + nombre + ' ' + apellido);
    };
  }

  function openRelease(num){
    var r = registros[num] || {};
    var ov = document.createElement('div');
    ov.className = 'overlay';
    ov.innerHTML = '<div class="card"><h2>Número ' + num + '</h2>' +
      '<p>Registrado a: <b>' + (r.nombre||'') + ' ' + (r.apellido||'') + '</b>' +
      (r.cedula ? '<br>Cédula: ' + r.cedula : '') + (r.telefono ? '<br>Teléfono: ' + r.telefono : '') + '</p>' +
      '<div class="row"><button class="btn ghost" id="cancel">Cerrar</button><button class="btn danger" id="liberar">Liberar</button></div></div>';
    document.body.appendChild(ov);
    ov.querySelector('#cancel').onclick = function(){ ov.remove(); };
    ov.querySelector('#liberar').onclick = function(){
      delete registros[num]; save(); ov.remove(); renderGrid(); toast('Número ' + num + ' liberado');
    };
  }

  function pop(num){
    var el = grid.querySelector('[data-num="'+num+'"]');
    if(el){ el.classList.add('pop'); setTimeout(function(){el.classList.remove('pop');},350); }
  }

  function confetti(){
    var colors=['#c0392b','#c9973b','#1e8a5f','#3b6ac9'];
    for(var i=0;i<16;i++){
      var c = document.createElement('div');
      c.className='confetti';
      c.style.left = (45+Math.random()*10)+'vw';
      c.style.background = colors[i%colors.length];
      c.style.animationDuration = (1+Math.random()*0.8)+'s';
      document.body.appendChild(c);
      (function(node){ setTimeout(function(){ node.remove(); }, 2000); })(c);
    }
  }

  var toastTimer;
  function toast(msg){
    var t = document.getElementById('toast');
    t.textContent = msg; t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ t.classList.remove('show'); }, 2200);
  }

  function loadData(){
    fetch(API).then(function(r){ return r.json(); }).then(function(d){
      registros = (d && d.registros) ? d.registros : {};
      renderGrid(searchEl.value.replace(/[^0-9]/g,'') || null);
    }).catch(function(){ toast('No se pudo cargar la base de datos'); });
  }

  function save(){
    fetch(API, {
      method:'PUT', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ registros: registros })
    }).catch(function(){ toast('No se pudo sincronizar el guardado'); });
  }

  renderBanner();
})();
</script>
</body>
</html>
